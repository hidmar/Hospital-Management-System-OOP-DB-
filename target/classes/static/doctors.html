<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hospital Staff - Doctors</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 1000px;
        }
        h2 {
            margin-bottom: 30px;
            color: #007bff; /* Professional Blue */
            font-weight: 700;
        }
        .btn-back {
            margin-bottom: 20px;
            background-color: #6c757d;
            color: white;
            border: none;
        }
        .btn-back:hover {
            background-color: #5a6268;
            text-decoration: none;
            color: white;
        }
        /* Table Styling */
        .table thead th {
            background-color: #007bff;
            color: white;
            border-color: #007bff;
        }
        .table-hover tbody tr:hover {
            background-color: #f1f1f1;
        }
    </style>
</head>
<body>

<div class="container">
    <h2 class="text-center">Medical Staff Directory</h2>

    <a href="index.html" class="btn btn-back px-4 py-2 rounded">← Back to Dashboard</a>
    <a href="add-doctor.html" class="btn btn-primary mb-3 ml-2">+ Add New Doctor</a>

    <div class="table-responsive">
        <table class="table table-bordered table-hover">
            <thead>
            <tr>
                <th style="width: 5%">ID</th>
                <th style="width: 25%">Doctor Name</th>
                <th style="width: 25%">Specialization</th>
                <th style="width: 25%">Email</th>
                <th style="width: 20%">Department</th>
            </tr>
            </thead>
            <tbody id="doctors-table-body">
            </tbody>
        </table>
    </div>
</div>

<script>
    // The API Endpoint we created in Spring Boot
    const API_URL = 'http://localhost:8080/api/doctors';

    function loadDoctors() {
        const tbody = document.getElementById('doctors-table-body');

        // Show a loading message while fetching
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">Loading doctor records...</td></tr>';

        fetch(API_URL)
            .then(response => {
                if (!response.ok) {
                    throw new Error('Failed to connect to the server');
                }
                return response.json();
            })
            .then(doctors => {
                // Clear the "Loading" message
                tbody.innerHTML = '';

                // Handle case where database is empty
                if (doctors.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center">No doctors found in the database.</td></tr>';
                    return;
                }

                // Loop through the data and build table rows
                doctors.forEach(doctor => {
                    const row = tbody.insertRow();

                    // 1. ID
                    row.insertCell().textContent = doctor.id;

                    // 2. Full Name (Combining firstName + lastName)
                    const fullName = `${doctor.firstName} ${doctor.lastName}`;
                    row.insertCell().textContent = fullName;

                    // 3. Specialization
                    row.insertCell().textContent = doctor.specialization;

                    // 4. Email
                    row.insertCell().textContent = doctor.email;

                    // 5. Department (Check null safety in case a doctor has no dept)
                    const deptName = doctor.department ? doctor.department.name : 'Unassigned';
                    const deptCell = row.insertCell();
                    deptCell.textContent = deptName;

                    // Optional: Add a badge style to the department
                    if(doctor.department) {
                        deptCell.innerHTML = `<span class="badge badge-info">${deptName}</span>`;
                    }
                });
            })
            .catch(error => {
                console.error('Error:', error);
                tbody.innerHTML = `<tr><td colspan="5" class="text-danger text-center font-weight-bold">
                    Error loading data. <br>
                    <small>Is your Spring Boot application running?</small>
                </td></tr>`;
            });
    }

    // Run this function immediately when the page loads
    document.addEventListener('DOMContentLoaded', loadDoctors);
</script>

</body>
</html>
