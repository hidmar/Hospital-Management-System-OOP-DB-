<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hospital - Patient Registry</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 95%;
            max-width: 1400px;
        }
        h2 { color: #28a745; font-weight: 700; margin-bottom: 30px; }
        .btn-back { background-color: #6c757d; color: white; border: none; margin-bottom: 20px; }
        .btn-back:hover { background-color: #5a6268; color: white; text-decoration: none; }

        .table thead th {
            background-color: #28a745; color: white; border-color: #28a745;
            vertical-align: middle; font-size: 0.9rem;
        }
        .table td { vertical-align: middle; font-size: 0.95rem; }
        .badge-room { background-color: #6610f2; color: white; }
        .badge-nurse { background-color: #e83e8c; color: white; }
        .badge-doc { background-color: #007bff; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h2 class="text-center">Patient Registry</h2>

    <div class="d-flex justify-content-between">
        <a href="index.html" class="btn btn-back px-4 py-2 rounded">← Back to Dashboard</a>
        <a href="add-patient.html" class="btn btn-success mb-3 ml-2">+ Add New Patient</a>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered table-hover">
            <thead>
            <tr>
                <th style="width: 5%">ID</th>
                <th style="width: 15%">Patient Name</th>
                <th style="width: 10%">Insurance ID</th>
                <th style="width: 15%">Contact</th>
                <th style="width: 15%">Doctor</th>
                <th style="width: 10%">Ward/Room</th>
                <th style="width: 10%">Nurse</th>
                <th style="width: 10%">Actions</th> </tr>
            </thead>
            <tbody id="patients-table-body">
            </tbody>
        </table>
    </div>
</div>

<script>
    const API_URL = 'http://localhost:8080/api/patients';

    function loadPatients() {
        const tbody = document.getElementById('patients-table-body');
        tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted">Loading records...</td></tr>';

        fetch(API_URL)
            .then(response => {
                if (!response.ok) throw new Error('Failed to connect');
                return response.json();
            })
            .then(patients => {
                tbody.innerHTML = '';

                if (patients.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" class="text-center">No patients found.</td></tr>';
                    return;
                }

                patients.forEach(patient => {
                    const row = tbody.insertRow();

                    row.insertCell().textContent = patient.id;
                    row.insertCell().innerHTML = `<strong>${patient.firstName} ${patient.lastName}</strong>`;
                    row.insertCell().textContent = patient.insuranceId || 'N/A';

                    const contactCell = row.insertCell();
                    contactCell.innerHTML = `<small>📧 ${patient.email}</small><br><small>📞 ${patient.phoneNumber || 'N/A'}</small>`;

                    // Doctor
                    const docCell = row.insertCell();
                    docCell.innerHTML = patient.doctor ? `<span class="badge badge-doc">Dr. ${patient.doctor.lastName}</span>` : '<span class="text-muted small">Not Assigned</span>';

                    // Ward & Room (Combined for space)
                    const locCell = row.insertCell();
                    const ward = patient.ward ? patient.ward.name : '-';
                    const room = patient.room ? `Rm ${patient.room.roomNumber}` : '-';
                    locCell.innerHTML = `${ward}<br><span class="badge badge-room">${room}</span>`;

                    // Nurse
                    const nurseCell = row.insertCell();
                    nurseCell.innerHTML = patient.nurse ? `<span class="badge badge-nurse">${patient.nurse.firstName}</span>` : '-';

                    // --- NEW: DELETE BUTTON ---
                    const actionCell = row.insertCell();
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'btn btn-outline-danger btn-sm';
                    deleteBtn.innerHTML = 'Delete';

                    // --- NEW: PROFILE BUTTON ---
                    const profileBtn = document.createElement('a');
                    profileBtn.className = 'btn btn-info btn-sm mr-2'; // 'mr-2' adds spacing
                    profileBtn.innerHTML = '👤 View Profile';
                    profileBtn.href = `patient-profile.html?id=${patient.id}`; // Passes ID to the new page

                    actionCell.appendChild(profileBtn);
                    // (The delete button code continues here...)

                    // Add Click Event
                    deleteBtn.onclick = function() {
                        deletePatient(patient.id, patient.firstName, patient.lastName);
                    };

                    actionCell.appendChild(deleteBtn);
                });
            })
            .catch(error => {
                console.error('Error:', error);
            });
    }

    // Function to handle the actual deletion
    function deletePatient(id, fname, lname) {
        // 1. Confirm with the user first
        const isConfirmed = confirm(`Are you sure you want to delete patient: ${fname} ${lname}?\n\nThis action cannot be undone.`);

        if (isConfirmed) {
            fetch(`${API_URL}/${id}`, {
                method: 'DELETE'
            })
                .then(response => {
                    if (response.ok) {
                        alert("✅ Patient deleted successfully.");
                        loadPatients(); // Reload the list to remove the row
                    } else {
                        alert("❌ Error: Could not delete patient.\nThey might have active Appointments or Invoices linked to them.");
                    }
                })
                .catch(error => console.error('Error:', error));
        }
    }

    document.addEventListener('DOMContentLoaded', loadPatients);
</script>

</body>
</html>
