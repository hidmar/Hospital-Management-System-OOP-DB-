<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Invoice</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <style>body { background-color: #f4f7f6; padding-top: 50px; }</style>
</head>
<body>
<div class="container bg-white p-4 rounded shadow" style="max-width: 500px;">
  <h3 class="text-center text-success mb-4">Generate New Invoice</h3>

  <form id="invoiceForm">
    <div class="form-group">
      <label>Select Patient</label>
      <select id="patientSelect" class="form-control" required>
        <option value="">Loading patients...</option>
      </select>
    </div>

    <div class="form-group">
      <label>Total Amount ($)</label>
      <input type="number" id="amount" class="form-control" step="0.01" required>
    </div>

    <div class="form-group">
      <label>Payment Method</label>
      <select id="paymentMethod" class="form-control" required>
        <option value="Cash">Cash</option>
        <option value="Card">Card</option>
        <option value="Insurance">Insurance</option>
      </select>
    </div>

    <div class="form-group form-check">
      <input type="checkbox" class="form-check-input" id="isPaid">
      <label class="form-check-label">Mark as Paid</label>
    </div>

    <button type="submit" class="btn btn-success btn-block">Save Invoice</button>
    <a href="lab-billing.html" class="btn btn-link btn-block">Cancel</a>
  </form>
</div>

<script>
  // 1. Load Patients
  fetch('http://localhost:8080/api/patients')
          .then(res => res.json())
          .then(data => {
            const select = document.getElementById('patientSelect');
            select.innerHTML = '<option value="">-- Select Patient --</option>';
            data.forEach(p => {
              const opt = document.createElement('option');
              opt.value = p.id;
              opt.textContent = `${p.firstName} ${p.lastName}`;
              select.appendChild(opt);
            });
          });

  // 2. Submit Form
  document.getElementById('invoiceForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const data = {
      patient: { id: document.getElementById('patientSelect').value },
      totalAmount: document.getElementById('amount').value,
      paymentMethod: document.getElementById('paymentMethod').value,
      paid: document.getElementById('isPaid').checked,
      issueDate: new Date().toISOString() // Sets current time
    };

    fetch('http://localhost:8080/api/invoices', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    }).then(res => {
      if(res.ok) { alert("Invoice Created!"); window.location.href = "lab-billing.html"; }
    });
  });
</script>
</body>
</html>
