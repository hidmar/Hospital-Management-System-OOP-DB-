<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New Doctor</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body { background-color: #f4f7f6; padding-top: 50px; }
        .form-container {
            background-color: white; padding: 40px; border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; margin: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="form-container">
        <h3 class="text-center text-primary mb-4">Register New Doctor</h3>
        <form id="doctorForm">
            <div class="form-group">
                <label>First Name</label>
                <input type="text" id="firstName" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" id="lastName" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Specialization</label>
                <input type="text" id="specialization" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Department</label>
                <select id="departmentSelect" class="form-control" required>
                    <option value="">Loading departments...</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Save Doctor</button>
            <a href="doctors.html" class="btn btn-link btn-block">Cancel</a>
        </form>
    </div>
</div>

<script>
    // 1. Load Departments when page opens
    document.addEventListener('DOMContentLoaded', () => {
        fetch('http://localhost:8080/api/departments')
            .then(res => res.json())
            .then(data => {
                const select = document.getElementById('departmentSelect');
                select.innerHTML = '<option value="">-- Select Department --</option>';
                data.forEach(dept => {
                    const option = document.createElement('option');
                    option.value = dept.id; // The ID is what matters
                    option.textContent = dept.name; // The name is what the user sees
                    select.appendChild(option);
                });
            });
    });

    // 2. Handle Form Submission
    document.getElementById('doctorForm').addEventListener('submit', function(event) {
        event.preventDefault();

        const data = {
            firstName: document.getElementById('firstName').value,
            lastName: document.getElementById('lastName').value,
            specialization: document.getElementById('specialization').value,
            email: document.getElementById('email').value,
            // We send the department as an object with an ID
            department: {
                id: document.getElementById('departmentSelect').value
            }
        };

        fetch('http://localhost:8080/api/doctors', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
            .then(response => {
                if(response.ok) {
                    alert("✅ Doctor Added Successfully!");
                    window.location.href = "doctors.html";
                } else {
                    alert("❌ Error adding doctor.");
                }
            });
    });
</script>
</body>
</html>
