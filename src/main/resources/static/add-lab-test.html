<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add New Test</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <style>body { background-color: #f4f7f6; padding-top: 50px; }</style>
</head>
<body>
<div class="container bg-white p-4 rounded shadow" style="max-width: 500px;">
  <h3 class="text-center text-primary mb-4">Define New Lab Test</h3>

  <form id="testForm">
    <div class="form-group">
      <label>Test Name</label>
      <input type="text" id="name" class="form-control" required>
    </div>
    <div class="form-group">
      <label>Description</label>
      <input type="text" id="description" class="form-control">
    </div>
    <div class="form-group">
      <label>Price ($)</label>
      <input type="number" step="0.01" id="price" class="form-control" required>
    </div>

    <button type="submit" class="btn btn-primary btn-block">Save Test</button>
    <a href="lab-billing.html" class="btn btn-link btn-block">Cancel</a>
  </form>
</div>

<script>
  document.getElementById('testForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const data = {
      name: document.getElementById('name').value,
      description: document.getElementById('description').value,
      price: document.getElementById('price').value
    };

    fetch('http://localhost:8080/api/lab/tests', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    }).then(res => {
      if(res.ok) { alert("Test Added!"); window.location.href = "lab-billing.html"; }
    });
  });
</script>
</body>
</html>
